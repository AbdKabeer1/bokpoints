# Render Blueprint for the Poket API.
#
# Deploy: Render dashboard → New → Blueprint → pick this repository.
# Render reads this file, builds the API, and prompts for the four secrets
# (they are never stored in the repository).
#
# The free plan sleeps after inactivity; the Starter plan keeps it warm. For a
# pilot where a cashier may scan at any moment, Starter is the honest choice.

services:
  - type: web
    name: poket-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /v1/health
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @bokpoints/shared build && corepack pnpm --filter @bokpoints/api build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        value: https://app.omapointii.store,https://till.omapointii.store,https://portal.omapointii.store,https://admin.omapointii.store
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
